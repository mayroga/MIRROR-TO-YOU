<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRROR TO YOU — The Private Life Concierge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0a',
                        surface: '#121212',
                        card: '#18181b',
                        gold: {
                            light: '#e2c999',
                            DEFAULT: '#c5a059',
                            dark: '#9a7b38'
                        },
                        platinum: '#e5e7eb'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass-panel {
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.15);
        }
        .glow-gold {
            box-shadow: 0 0 50px -15px rgba(197, 160, 89, 0.12);
        }
        textarea::-webkit-scrollbar {
            width: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(197, 160, 89, 0.3);
        }
    </style>
</head>
<body class="bg-obsidian text-platinum antialiased min-h-screen flex flex-col justify-between selection:bg-gold selection:text-obsidian">

    <!-- Minimalist Header -->
    <header class="w-full px-8 py-6 flex items-center justify-between border-b border-white/5">
        <a href="/" class="flex items-center space-x-3 group">
            <div class="w-7 h-7 rounded-full border border-gold/40 flex items-center justify-center transition-colors group-hover:border-gold">
                <div class="w-1.5 h-1.5 rounded-full bg-gold"></div>
            </div>
            <span class="font-serif tracking-[0.25em] text-sm text-platinum font-medium">MIRROR TO YOU</span>
        </a>
        <div class="flex items-center space-x-6 text-xs uppercase tracking-widest font-light">
            <a href="/dashboard" class="text-platinum/60 hover:text-gold transition-colors">Dashboard</a>
            <a href="/profile" class="text-platinum/60 hover:text-gold transition-colors">Profile</a>
        </div>
    </header>

    <!-- Main Conversational Interface -->
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-2xl mx-auto text-center space-y-8">
            
            <!-- Greeting / Manifesto -->
            <div class="space-y-3">
                <span class="text-[10px] uppercase tracking-[0.3em] text-gold font-medium block">Private Concierge Service</span>
                <h1 class="font-serif text-3xl sm:text-5xl text-white tracking-wide font-normal">What do you need today?</h1>
                <p class="text-xs sm:text-sm text-platinum/50 font-light max-w-md mx-auto tracking-wide">
                    You don't need to search. Share your requirement, and our team will take care of the rest.
                </p>
            </div>

            <!-- Conversational Input Box -->
            <div class="glass-panel p-4 sm:p-6 rounded-none glow-gold text-left space-y-4">
                <form id="conciergeForm" onsubmit="handleDirectiveSubmit(event)" class="space-y-4">
                    <div class="relative">
                        <textarea id="queryInput" rows="4" required placeholder="e.g., Plan a private 5-day escape to Italy for two, or secure a table at a secluded coastal retreat..." class="w-full bg-obsidian/80 border border-white/10 p-4 text-sm text-platinum placeholder-platinum/30 focus:outline-none focus:border-gold transition-colors resize-none"></textarea>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2 border-t border-white/5">
                        <div class="text-[11px] text-platinum/40 tracking-wider flex items-center space-x-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-gold"></span>
                            <span>Desk Alpha &bull; Secure Encrypted Relay</span>
                        </div>
                        <button type="submit" id="submitBtn" class="w-full sm:w-auto bg-gold text-obsidian text-xs tracking-[0.2em] uppercase px-8 py-3 font-medium hover:bg-gold-light transition-all flex items-center justify-center space-x-2">
                            <span>Submit Directive</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </form>

                <!-- Response Status View (Hidden by default) -->
                <div id="responseContainer" class="hidden pt-4 border-t border-gold/20 space-y-3 animate-fade-in">
                    <div class="flex items-center justify-between text-xs">
                        <span id="resId" class="text-gold font-mono tracking-widest"></span>
                        <span id="resStatus" class="text-emerald-400 uppercase tracking-widest text-[10px] bg-emerald-500/10 px-2 py-0.5 border border-emerald-500/30"></span>
                    </div>
                    <p id="resMessage" class="text-xs text-platinum/80 leading-relaxed font-light"></p>
                    <div class="flex justify-end pt-2">
                        <a href="/dashboard" class="text-[10px] uppercase tracking-widest text-gold hover:underline">View in Dashboard &rarr;</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="w-full py-6 text-center text-[10px] tracking-widest text-platinum/30 uppercase border-t border-white/5">
        <p>&copy; 2026 Mirror To You. Private Account Only.</p>
    </footer>

    <script>
        async function handleDirectiveSubmit(event) {
            event.preventDefault();
            
            const query = document.getElementById('queryInput').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const responseContainer = document.getElementById('responseContainer');
            
            if (!query) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "Securing Directive...";

            try {
                const response = await fetch('/api/concierge/request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        category: "Bespoke Directive"
                    })
                });

                if (!response.ok) {
                    throw new Error('Communication error with secure relay.');
                }

                const data = await response.json();

                document.getElementById('resId').textContent = `Reference: ${data.request_id}`;
                document.getElementById('resStatus').textContent = data.status;
                document.getElementById('resMessage').textContent = data.message;
                
                responseContainer.classList.remove('hidden');
                document.getElementById('queryInput').value = '';

            } catch (error) {
                alert('Unable to transmit directive at this moment. Please verify your secure session.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Submit Directive</span><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
            }
        }
    </script>
</body>
</html>
