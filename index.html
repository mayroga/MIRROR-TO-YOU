<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL CIELO — Asesoría Logística y Operativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0a',
                        surface: '#121212',
                        card: '#18181b',
                        gold: {
                            light: '#e2c999',
                            DEFAULT: '#c5a059',
                            dark: '#9a7b38'
                        },
                        platinum: '#e5e7eb'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(18, 18, 20, 0.95);
            border: 1px solid rgba(197, 160, 89, 0.2);
        }
    </style>
</head>
<body class="bg-obsidian text-platinum antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full glass-panel border-b border-white/10 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-gold"></div>
            <span class="font-serif tracking-widest text-sm text-white font-medium">AL CIELO — Panel de Asesoría</span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="window.print()" class="text-xs uppercase tracking-widest bg-gold/10 text-gold px-3 py-1.5 border border-gold/30 hover:bg-gold/20">Imprimir / PDF</button>
            <button onclick="borrarDatos()" class="text-xs uppercase tracking-widest bg-red-950/40 text-red-400 px-3 py-1.5 border border-red-500/30 hover:bg-red-900/40">Borrar</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-4xl mx-auto w-full p-6 space-y-6">
        
        <!-- Action Box -->
        <div class="glass-panel p-6 space-y-4">
            <h2 class="text-xs uppercase tracking-widest text-gold font-medium">Consulta Operativa Directa</h2>
            <p class="text-xs text-platinum/70">Describa la situación de carga, mercancía o transporte para recibir directrices inmediatas.</p>
            
            <textarea id="consultaInput" rows="4" class="w-full bg-obsidian border border-white/10 p-4 text-xs text-platinum focus:border-gold outline-none resize-none" placeholder="Escriba aquí los detalles del caso (ej. tipo de estiba, peso, aerolínea, regulaciones)..."></textarea>
            
            <div class="flex items-center justify-between pt-2">
                <span class="text-[10px] text-platinum/40 uppercase">Regulado bajo normativas aplicables</span>
                <button onclick="ejecutarAsesoria()" class="bg-gold text-obsidian text-xs uppercase tracking-widest font-semibold px-6 py-2.5 hover:bg-gold-light transition-colors">Obtener Solución</button>
            </div>
        </div>

        <!-- Result Box (Dynamic Table Output) -->
        <div id="resultadoContainer" class="glass-panel p-6 space-y-4 hidden">
            <h2 class="text-xs uppercase tracking-widest text-gold font-medium">Instrucción y Directrices de Asesoría</h2>
            <div id="resultadoContenido" class="overflow-x-auto">
                <!-- Se llena dinámicamente con tablas -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-[10px] tracking-widest text-platinum/30 uppercase border-t border-white/5">
        <p>&copy; 2026 AL CIELO. Uso Exclusivo Profesional.</p>
    </footer>

    <script>
        function ejecutarAsesoria() {
            const texto = document.getElementById('consultaInput').value.trim();
            const contenedor = document.getElementById('resultadoContenido');
            const cajaResultado = document.getElementById('resultadoContainer');

            if (!texto) {
                alert("Por favor, ingrese los detalles de la consulta.");
                return;
            }

            cajaResultado.classList.remove('hidden');

            // Generar tabla limpia y directa con solución profesional
            contenedor.innerHTML = `
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="border-b border-gold/30 text-gold">
                            <th class="py-2 px-3 uppercase tracking-wider">Acción Inmediata</th>
                            <th class="py-2 px-3 uppercase tracking-wider">Normativa / Referencia</th>
                            <th class="py-2 px-3 uppercase tracking-wider">Estado</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-white/5">
                        <tr>
                            <td class="py-3 px-3 font-medium text-white">Verificar estiba y asegurar manipulación según estándar.</td>
                            <td class="py-3 px-3 text-platinum/70">Operativa / Seguridad</td>
                            <td class="py-3 px-3 text-gold">Revisar y Rectificar</td>
                        </tr>
                        <tr>
                            <td class="py-3 px-3 font-medium text-white">Ajustar documentación y pesos de carga.</td>
                            <td class="py-3 px-3 text-platinum/70">Control Logístico</td>
                            <td class="py-3 px-3 text-gold">Completado</td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        function borrarDatos() {
            document.getElementById('consultaInput').value = '';
            document.getElementById('resultadoContainer').classList.add('hidden');
            document.getElementById('resultadoContenido').innerHTML = '';
        }
    </script>
</body>
</html>
