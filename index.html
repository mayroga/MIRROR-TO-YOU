<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRROR TO YOU — Panel de Control y Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0a',
                        surface: '#121212',
                        card: '#18181b',
                        gold: {
                            light: '#e2c999',
                            DEFAULT: '#c5a059',
                            dark: '#9a7b38'
                        },
                        platinum: '#e5e7eb'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(18, 18, 20, 0.95);
            border: 1px solid rgba(197, 160, 89, 0.2);
        }
    </style>
</head>
<body class="bg-obsidian text-platinum antialiased min-h-screen flex flex-col justify-between">

    <!-- Header Operativo -->
    <header class="w-full glass-panel border-b border-white/10 px-8 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-gold"></div>
            <span class="font-serif tracking-widest text-sm text-white font-medium">MIRROR TO YOU</span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="window.print()" class="text-xs uppercase tracking-widest bg-gold/10 text-gold px-3.5 py-1.5 border border-gold/30 hover:bg-gold/20 transition-colors">Imprimir / PDF</button>
            <button onclick="borrarDatos()" class="text-xs uppercase tracking-widest bg-red-950/40 text-red-400 px-3.5 py-1.5 border border-red-500/30 hover:bg-red-900/40 transition-colors">Borrar</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-4xl mx-auto w-full p-6 space-y-6">
        
        <div class="glass-panel p-6 space-y-4">
            <h1 class="font-serif text-xl text-white">Gestión y Registro Directo</h1>
            <p class="text-xs text-platinum/70">Ingrese la información requerida para procesar el registro de forma inmediata y ordenada.</p>
            
            <textarea id="textoRegistro" rows="6" class="w-full bg-obsidian border border-white/10 p-4 text-xs text-platinum focus:border-gold outline-none resize-none" placeholder="Escriba o pegue aquí los datos a procesar..."></textarea>
            
            <div class="flex items-center justify-between pt-2">
                <span id="estadoGuardado" class="text-[10px] text-gold hidden">Guardado en sesión</span>
                <button onclick="procesarRegistro()" class="bg-gold text-obsidian text-xs uppercase tracking-widest font-semibold px-6 py-2.5 hover:bg-gold-light transition-colors ml-auto">Procesar Registro</button>
            </div>
        </div>

        <!-- Resultados en Tabla Dinámica -->
        <div id="resultadoContainer" class="glass-panel p-6 space-y-4 hidden">
            <h2 class="text-xs uppercase tracking-widest text-gold font-medium">Reporte Generado</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="border-b border-gold/30 text-gold">
                            <th class="py-2.5 px-3 uppercase tracking-wider">Parámetro / Detalle</th>
                            <th class="py-2.5 px-3 uppercase tracking-wider">Estado de Validación</th>
                            <th class="py-2.5 px-3 uppercase tracking-wider">Acción Directa</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo" class="divide-y divide-white/5">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-[10px] tracking-widest text-platinum/30 uppercase border-t border-white/5">
        <p>&copy; 2026 Mirror To You. All Rights Reserved.</p>
    </footer>

    <script>
        function procesarRegistro() {
            const texto = document.getElementById('textoRegistro').value.trim();
            const contenedor = document.getElementById('resultadoContainer');
            const cuerpoTabla = document.getElementById('tablaCuerpo');
            const aviso = document.getElementById('estadoGuardado');

            if (!texto) {
                alert("Por favor, ingrese información en el campo de texto.");
                return;
            }

            // Mostrar contenedor y guardar localmente
            contenedor.classList.remove('hidden');
            localStorage.setItem('mirror_registro', texto);
            
            aviso.classList.remove('hidden');
            setTimeout(() => aviso.classList.add('hidden'), 3000);

            // Generar fila limpia en la tabla
            cuerpoTabla.innerHTML = `
                <tr>
                    <td class="py-3 px-3 font-medium text-white max-w-xs truncate">${texto}</td>
                    <td class="py-3 px-3 text-gold">Verificado y Activo</td>
                    <td class="py-3 px-3 text-platinum/70">Procesado Correctamente</td>
                </tr>
            `;
        }

        function borrarDatos() {
            document.getElementById('textoRegistro').value = '';
            document.getElementById('resultadoContainer').classList.add('hidden');
            document.getElementById('tablaCuerpo').innerHTML = '';
            localStorage.removeItem('mirror_registro');
        }

        // Cargar datos previos si existen
        window.onload = function() {
            const guardado = localStorage.getItem('mirror_registro');
            if (guardado) {
                document.getElementById('textoRegistro').value = guardado;
                procesarRegistro();
            }
        }
    </script>
</body>
</html>
