<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05070a">
    <title>MIRROR</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <!-- Control bilingüe instantáneo y acceso a memoria sin fricción -->
        <header class="luxury-header">
            <div class="mirror-logo" onclick="window.location.reload()">
                <span class="logo-orb"></span>
                <span class="logo-text">MIRROR</span>
            </div>
            <div class="header-controls">
                <button id="langToggle" class="text-btn" type="button">EN / ES</button>
                <button id="memoryButton" class="icon-btn" type="button" aria-label="Context">◌</button>
            </div>
        </header>

        <main class="luxury-main">
            <!-- PANTALLA PRINCIPAL: Enfocada, limpia, directa -->
            <section id="mainDeck" class="deck active">
                <div class="hero-section">
                    <h1 id="heroTitle">Streamlined Execution.</h1>
                    <p id="heroSub">Your private ecosystem. Speak or input your requirements below.</p>
                </div>

                <!-- Objetivos Dinámicos del Cliente (Aparece fluidamente) -->
                <div id="planArea" class="plan-panel hidden">
                    <div class="panel-header">
                        <span class="status-badge">LIVE DIRECTION</span>
                        <h2 id="planTitle">Autonomous Coordination</h2>
                    </div>
                    <p id="planReply" class="premium-reply"></p>
                    <div id="directions" class="premium-directions"></div>
                    
                    <div id="planActions" class="action-grid">
                        <button id="mapsButton" class="luxury-action-btn" type="button">✨ Exclusive Maps</button>
                        <button id="musicButton" class="luxury-action-btn" type="button">🎵 Acoustic Space</button>
                        <button id="conciergeButton" class="luxury-action-btn primary-gold" type="button">✦ Request Concierge</button>
                    </div>
                </div>

                <!-- Círculo Respiratorio Profesional Integrado y Variable (No intrusivo) -->
                <div id="breathingArea" class="breathing-panel hidden">
                    <div class="orb-container">
                        <div id="breathingOrb" class="professional-orb">
                            <div class="orb-inner">
                                <span id="breathingPhase">READY</span>
                                <strong id="breathingTimer">04:00</strong>
                            </div>
                        </div>
                    </div>
                    <div class="orb-meta">
                        <p id="breathingInstruction">Tap to sync your rhythm.</p>
                        <button id="breathingControlBtn" class="control-pill" type="button">Begin</button>
                    </div>
                </div>
            </section>

            <!-- PANTALLA DE MEMORIA Y PREFERENCIAS -->
            <section id="memoryScreen" class="deck">
                <div class="deck-header">
                    <button id="closeMemory" class="close-btn" type="button">← Back</button>
                    <h2>System Memory & Ecosystem</h2>
                </div>
                <div id="memorySummary" class="memory-grid"></div>
                <div class="memory-footer">
                    <button id="clearMemoryButton" class="danger-pill" type="button">Purge Local Context</button>
                </div>
            </section>
        </main>

        <!-- COMPOSER BAR: La única barra permanente para control fluido por voz o texto -->
        <footer class="luxury-footer">
            <div class="composer-container">
                <button id="voiceButton" class="action-trigger mic-trigger" type="button" aria-label="Voice Command">●</button>
                <textarea id="messageInput" rows="1" placeholder="Command your rhythm..." aria-label="Context entry"></textarea>
                <button id="sendButton" class="action-trigger send-trigger" type="button" aria-label="Execute">↑</button>
            </div>
            <div id="voiceStatus" class="voice-status-bar hidden"></div>
        </footer>
    </div>

    <script src="/static/app.js" defer></script>
</body>
</html>
