<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Aura by May Roga LLC</title>
<style>
:root{--bg-color:#0a0a0c;--card-bg:#141416;--text-main:#f1f1f3;--text-muted:#999;--border-color:rgba(255,255,255,.1);--accent-color:#d4af37}
body{margin:0;padding:0;background:var(--bg-color);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;box-sizing:border-box}
.travel-advisor-box{width:100%;max-width:480px;padding:14px;box-sizing:border-box;max-height:calc(100dvh - 40px);overflow-y:auto;text-align:center}
.travel-advisor-box #modal-advisor-desc{text-align:center!important}
.tvid-curtain{width:100%;margin-top:14px}
.tvid-curtain-toggle{width:100%;background:rgba(15,23,42,.85);border:1px solid var(--border-color,rgba(255,255,255,.2));color:var(--text-main,#fff);padding:10px 12px;border-radius:10px;font-weight:600;font-size:.85rem;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.tvid-curtain-controls{display:flex;align-items:center;gap:8px}
.tvid-lang-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:var(--text-main,#fff);width:28px;height:28px;border-radius:50%;font-weight:600;font-size:.75rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tvid-modal-overlay{position:relative;top:auto;left:auto;width:100%;height:auto;background:none;backdrop-filter:none;display:flex;justify-content:center;align-items:stretch;z-index:auto;margin-top:10px}
.tvid-modal-container{background:var(--card-bg,#141416);border:1px solid var(--border-color,rgba(255,255,255,.1));width:100%;max-width:100%;border-radius:12px;padding:14px;color:var(--text-main,#f1f1f3);box-shadow:0 10px 25px rgba(0,0,0,.35)}
.tvid-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;border-bottom:1px solid var(--border-color,rgba(255,255,255,.08));padding-bottom:10px}
.tvid-badge{background:rgba(212,175,55,.15);color:var(--accent-color,#d4af37);font-size:10px;font-weight:600;padding:3px 6px;border-radius:4px;text-transform:uppercase}
.tvid-header h2{font-size:15px;margin:0;font-weight:500}
.tvid-close-btn{background:none;border:none;color:var(--text-muted,#888);font-size:22px;cursor:pointer}
.tvid-subtitle{font-size:12px;color:var(--text-muted,#999);margin-bottom:12px}
.tvid-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tvid-card-btn{background:var(--card-bg,#1e1e22);border:1px solid var(--border-color,rgba(255,255,255,.06));color:var(--text-main,#f1f1f3);padding:10px;border-radius:8px;font-size:12px;text-align:left;cursor:pointer}
.tvid-card-btn:hover{border-color:var(--accent-color,#d4af37)}
.tvid-card-btn.tvid-full{grid-column:span 2}
.tvid-exercise-top{display:flex;justify-content:flex-start;align-items:center;margin-bottom:10px}
.tvid-back-btn{background:none;border:none;color:var(--accent-color,#d4af37);cursor:pointer;font-size:12px}
.tvid-breath-container{display:flex;justify-content:center;align-items:center;margin:15px 0}
.tvid-breath-circle{width:90px;height:90px;border-radius:50%;background:rgba(212,175,55,.15);border:2px solid var(--accent-color,#d4af37);display:flex;justify-content:center;align-items:center;font-size:13px;font-weight:600;color:var(--accent-color,#d4af37);transition:transform 4s ease-in-out;box-shadow:0 0 20px rgba(212,175,55,.2)}
.tvid-breath-circle.inhale{transform:scale(1.35)}
.tvid-breath-circle.exhale{transform:scale(.9)}
.tvid-objective-box{background:rgba(212,175,55,.08);border-left:3px solid var(--accent-color,#d4af37);padding:8px 12px;border-radius:4px;font-size:12px;margin-bottom:10px;color:var(--text-main,#ddd)}
.tvid-steps-container{font-size:13px;line-height:1.5;color:var(--text-muted,#ccc);min-height:70px;margin-bottom:12px;background:rgba(0,0,0,.2);padding:12px;border-radius:8px}
.tvid-sec-action{background:rgba(255,255,255,.08);color:var(--text-main,#fff);border:1px solid var(--border-color,rgba(255,255,255,.2));padding:10px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.tvid-main-action{flex:1;background:var(--accent-color,#d4af37);color:var(--bg-color,#0a0a0c);border:none;padding:10px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.tvid-content-view{width:100%}
@media(max-width:480px){
.travel-advisor-box{width:100%;padding:18px!important;border-radius:14px}
.tvid-grid{grid-template-columns:1fr 1fr}
.tvid-card-btn{padding:9px 7px;font-size:11px;text-align:center}
.tvid-header h2{font-size:13px}
.tvid-modal-container{padding:12px}
.tvid-objective-box,.tvid-steps-container{font-size:12px}
.tvid-sec-action,.tvid-main-action{font-size:12px;padding:9px 7px}
}
</style>
</head>

{title:"⚫ Técnica del Mal — Extrae la enseñanza",objective:"Separar el dolor de la información útil que dejó una experiencia.",steps:["Recuerda una experiencia difícil de forma breve y distante.","Inhala durante 4 segundos buscando el dato o aprendizaje que dejó.","Mantén 2 segundos reconociendo que aprender no significa justificar lo ocurrido.","Exhala durante 6 segundos y conserva solamente la enseñanza útil."]},
{title:"⚫ Técnica del Mal — Transformar el golpe",objective:"Usar una experiencia negativa como materia prima para una respuesta más consciente.",steps:["Piensa en una situación que te haya enseñado algo difícil.","Inhala durante 4 segundos observando la experiencia con distancia.","Mantén 2 segundos preguntando qué capacidad desarrollaste gracias a ella.","Exhala durante 6 segundos y elige cómo aplicar esa capacidad ahora."]}

{title:"⚫ Adversity Technique — What I will not repeat",objective:"Turn a negative experience into a useful reference for the future.",steps:["Think about something you do not want to experience again.","Inhale for 4 seconds identifying what signal you missed or what you learned.","Hold for 2 seconds without blaming yourself for the past.","Exhale for 6 seconds and establish one decision that helps you act differently."]},

function getTvidProgress(){
try{
const saved=JSON.parse(localStorage.getItem(TVID_PROGRESS_KEY)||'{}');
const progress={};
Object.keys(tvidData).forEach(k=>{
const max=tvidData[k].es.length;
const n=parseInt(saved[k],10);
progress[k]=Number.isInteger(n)&&n>=0&&n<max?n:0
});
return progress
}catch(e){
const progress={};
Object.keys(tvidData).forEach(k=>progress[k]=0);
return progress
}
}
function getTvidNextIndex(techKey){
const progress=getTvidProgress();
return progress[techKey]||0
}
function setTvidNextIndex(techKey,n){
const progress=getTvidProgress();
const total=tvidData[techKey].es.length;
progress[techKey]=((n%total)+total)%total;
localStorage.setItem(TVID_PROGRESS_KEY,JSON.stringify(progress))
}
function toggleTvidWindow(){
const modal=document.getElementById('tvid-floating-window');
const arrow=document.getElementById('tvid-curtain-arrow');
const isVisible=modal.style.display==='flex';
if(isVisible){
stopTvidTimers();
modal.style.display='none';
if(arrow)arrow.innerText='＋'
}else{
modal.style.display='flex';
document.getElementById('tvid-selection-screen').style.display='block';
document.getElementById('tvid-exercise-screen').style.display='none';
stopTvidTimers();
if(arrow)arrow.innerText='−'
}
}
function toggleTvidLang(){
tvidLang=tvidLang==='es'?'en':'es';
document.getElementById('tvid-lang-btn').innerText=tvidLang.toUpperCase();
document.getElementById('tvid-main-title').innerText=tvidLang==='es'?'Puerto de Carga Rápida':'Quick Recharge Port';
document.getElementById('tvid-subtitle-text').innerText=tvidLang==='es'?'Selecciona tu protocolo de adaptación y bienestar:':'Select your protocol:';
document.getElementById('tvid-back-text').innerText=tvidLang==='es'?'← Volver':'← Back';
document.getElementById('tvid-speak-btn').innerText=tvidLang==='es'?'🔊 Escuchar':'🔊 Listen';
document.getElementById('tvid-float-label').innerText=tvidLang==='es'?'Carga Rápida (TVid)':'Quick Recharge (TVid)';
document.querySelectorAll('.tvid-card-btn span[data-es]').forEach(span=>{
span.innerText=span.dataset[tvidLang]
});
if(currentTechKey)updateTvidViewLang()
}
function loadTvidExercise(techKey){
if(timeLeft<=0){
closeSession();
return
}
if(!tvidData[techKey])return;
const localIndex=getTvidNextIndex(techKey);
currentTechKey=techKey;
currentExerciseIndex=localIndex;
currentStepIndex=0;
tvidExerciseCompleted=false;
document.getElementById('tvid-selection-screen').style.display='none';
document.getElementById('tvid-exercise-screen').style.display='block';
updateTvidViewLang();
startTvidLimit();
startBreathCycle();
speakCurrentStep()
}
function updateTvidViewLang(){
if(!currentTechKey)return;
const exerciseData=tvidData[currentTechKey][tvidLang][currentExerciseIndex];
if(!exerciseData)return;
document.getElementById('tvid-exercise-title').innerText=exerciseData.title;
document.getElementById('tvid-objective-text').innerText=exerciseData.objective;
document.getElementById('tvid-exercise-steps').innerText=exerciseData.steps[currentStepIndex];
const actionBtn=document.getElementById('tvid-action-btn');
actionBtn.innerText=currentStepIndex===exerciseData.steps.length-1
?(tvidLang==='es'?'Finalizar Carga':'Finish Recharge')
:(tvidLang==='es'?'Siguiente paso':'Next step');
const label=document.getElementById('tvid-breath-label');
if(label)label.innerText=tvidLang==='es'?'Inhala':'Inhale'
}
function nextTvidStep(){
if(!currentTechKey||tvidExerciseCompleted)return;
const exerciseData=tvidData[currentTechKey][tvidLang][currentExerciseIndex];
if(currentStepIndex<exerciseData.steps.length-1){
currentStepIndex++;
updateTvidViewLang();
speakCurrentStep();
return
}
tvidExerciseCompleted=true;
const nextIndex=(currentExerciseIndex+1)%tvidData[currentTechKey].es.length;
setTvidNextIndex(currentTechKey,nextIndex);
stopTvidTimers();
document.getElementById('tvid-exercise-screen').style.display='none';
document.getElementById('tvid-selection-screen').style.display='block';
document.getElementById('tvid-floating-window').style.display='flex';
const arrow=document.getElementById('tvid-curtain-arrow');
if(arrow)arrow.innerText='−'
}
function backTvidSelection(){
stopTvidTimers();
tvidExerciseCompleted=false;
document.getElementById('tvid-exercise-screen').style.display='none';
document.getElementById('tvid-selection-screen').style.display='block'
}
function speakCurrentStep(){
if(!currentTechKey)return;
const exerciseData=tvidData[currentTechKey][tvidLang][currentExerciseIndex];
if(!exerciseData)return;
const textToSpeak=exerciseData.steps[currentStepIndex];
if('speechSynthesis'in window){
window.speechSynthesis.cancel();
const utterance=new SpeechSynthesisUtterance(textToSpeak);
utterance.lang=tvidLang==='es'?'es-ES':'en-US';
utterance.rate=.95;
window.speechSynthesis.speak(utterance)
}
}
function startBreathCycle(){
const circle=document.getElementById('tvid-breath-circle');
const label=document.getElementById('tvid-breath-label');
let state=0;
if(breathAnimationInterval)clearInterval(breathAnimationInterval);
function applyBreath(){
if(state===0){
circle.className='tvid-breath-circle inhale';
label.innerText=tvidLang==='es'?'Inhala':'Inhale';
state=1
}else if(state===1){
circle.className='tvid-breath-circle inhale';
label.innerText=tvidLang==='es'?'Mantén':'Hold';
state=2
}else{
circle.className='tvid-breath-circle exhale';
label.innerText=tvidLang==='es'?'Exhala':'Exhale';
state=0
}
}
applyBreath();
breathAnimationInterval=setInterval(applyBreath,4000)
}
function startTvidLimit(){
stopTvidTimers();
tvidExerciseStartedAt=Date.now();
const allowed=Math.max(0,Math.min(300,timeLeft));
if(allowed<=0){
closeSession();
return
}
tvidLimitInterval=setInterval(()=>{
const elapsed=(Date.now()-tvidExerciseStartedAt)/1000;
if(elapsed>=allowed||elapsed>=300||timeLeft<=0){
stopTvidTimers();
document.getElementById('tvid-floating-window').style.display='none'
}
},500)
}
function stopTvidTimers(){
if(tvidLimitInterval)clearInterval(tvidLimitInterval);
if(breathAnimationInterval)clearInterval(breathAnimationInterval);
tvidLimitInterval=null;
breathAnimationInterval=null;
if('speechSynthesis'in window)window.speechSynthesis.cancel()
}
function closeTvidWindow(){
stopTvidTimers();
document.getElementById('tvid-floating-window').style.display='none';
const arrow=document.getElementById('tvid-curtain-arrow');
if(arrow)arrow.innerText='＋'
}
function closeSession(){
stopTvidTimers();
document.getElementById('tvid-floating-window').style.display='none';
}
</script>
