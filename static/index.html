<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05070a">
    <title>MIRROR</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <!-- Barra superior ultra-limpia sin textos corporativos explicativos -->
        <header class="luxury-header">
            <div class="mirror-logo" onclick="window.location.reload()">
                <span class="logo-orb"></span>
                <span class="logo-text">MIRROR</span>
            </div>
            <div class="header-controls">
                <button id="langToggle" class="text-btn" type="button">EN / ES</button>
                <button id="memoryButton" class="icon-btn" type="button" aria-label="Context">◌</button>
            </div>
        </header>

        <main class="luxury-main">
            <!-- PANTALLA PRINCIPAL: Consola de control directa y fluida -->
            <section id="mainDeck" class="deck active">
                <div class="hero-section">
                    <h1 id="heroTitle"></h1>
                    <p id="heroSub"></p>
                </div>

                <!-- Panel de Objetivos Dinámicos: La IA controla y escribe todo aquí -->
                <div id="planArea" class="plan-panel hidden">
                    <div class="panel-header">
                        <span id="statusBadge" class="status-badge"></span>
                        <h2 id="planTitle"></h2>
                    </div>
                    <p id="planReply" class="premium-reply"></p>
                    <div id="directions" class="premium-directions"></div>
                    
                    <div id="planActions" class="action-grid">
                        <button id="mapsButton" class="luxury-action-btn hidden" type="button"></button>
                        <button id="musicButton" class="luxury-action-btn hidden" type="button"></button>
                        <button id="conciergeButton" class="luxury-action-btn primary-gold hidden" type="button"></button>
                    </div>
                </div>

                <!-- Círculo Respiratorio Profesional: Sin textos fijos, los objetivos cambian dinámicamente -->
                <div id="breathingArea" class="breathing-panel hidden">
                    <div class="orb-container">
                        <div id="breathingOrb" class="professional-orb">
                            <div class="orb-inner">
                                <span id="breathingPhase"></span>
                                <strong id="breathingTimer">04:00</strong>
                            </div>
                        </div>
                    </div>
                    <div class="orb-meta">
                        <p id="breathingInstruction"></p>
                        <button id="breathingControlBtn" class="control-pill" type="button"></button>
                    </div>
                </div>
            </section>

            <!-- PANTALLA DE CONTEXTO SEGURO Y PREFERENCIAS -->
            <section id="memoryScreen" class="deck">
                <div class="deck-header">
                    <button id="closeMemory" class="close-btn" type="button"></button>
                    <h2 id="memoryTitle"></h2>
                </div>
                <div id="memorySummary" class="memory-grid"></div>
                <div class="memory-footer">
                    <button id="clearMemoryButton" class="danger-pill" type="button"></button>
                </div>
            </section>
        </main>

        <!-- BARRA DE COMANDO PERMANENTE: Control absoluto por voz o escritura -->
        <footer class="luxury-footer">
            <div class="composer-container">
                <button id="voiceButton" class="action-trigger mic-trigger" type="button" aria-label="Voice Command">●</button>
                <textarea id="messageInput" rows="1" aria-label="Context entry"></textarea>
                <button id="sendButton" class="action-trigger send-trigger" type="button" aria-label="Execute">↑</button>
            </div>
            <div id="voiceStatus" class="voice-status-bar hidden"></div>
        </footer>
    </div>

    <script src="/static/app.js" defer></script>
</body>
</html>
